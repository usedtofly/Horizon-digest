theme: jekyll-theme-minimal
title: Horizon Daily
description: AI-curated daily digest of tech and research news
baseurl: "/Horizon-digest" # 必须与仓库名完全一致（GitHub Pages 项目站点的路径区分大小写）
url: "https://usedtofly.github.io" # 上级用户站点域名，项目站点挂在它的子路径下

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
